name: cardd_yolo11n_tuned
description: >
  Personalized augmentation (simulating real yard-photo lighting/angle conditions) +
  hyperparameter tuning motivated by the class imbalance and recall gap found in 01_baseline.
  Staged in the original repo as kaggle_train_yolo11_tuned.ipynb but never executed; not yet
  empirically compared against the baseline.
model:
  variant: yolo11n
train:
  epochs: 100
  imgsz: 640
  batch: 16
  seed: 0
  deterministic: true
  patience: 20
  device: 0
  cache: ram
  optimizer: SGD       # explicit optimizer so lr0 below actually applies (default "auto" silently ignores lr0/momentum)
  lr0: 0.005           # lower initial LR appropriate for fine-tuning a pretrained model, default 0.01
  freeze: 10           # freeze first 10 backbone layers, reduces overfit risk on ~2.8k images, default None
  weight_decay: 0.001  # stronger L2 regularization for a small dataset, default 0.0005
  cls: 0.75            # upweight classification loss given the ~10x class imbalance, default 0.5
augment:
  hsv_h: 0.02        # color-temperature shift between light sources, default 0.015
  hsv_v: 0.6         # lighting effect (sun/shadow/indoor), default 0.4
  degrees: 12        # tilted/handheld phone angle, default 0.0
  perspective: 0.0008  # close-up phone-lens distortion, default 0.0
