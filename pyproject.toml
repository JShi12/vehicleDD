[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cardd"
version = "0.1.0"
description = "Vehicle damage detection (YOLO11 / CarDD) - training pipeline and inference service"
readme = "README.md"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.9,<3.13"
authors = [{ name = "Jing Shi", email = "jingshi1988@gmail.com" }]
dependencies = [
    "ultralytics==8.4.90",
    "pyyaml",
    "numpy",
]

[project.optional-dependencies]
train = ["mlflow>=2.14", "matplotlib", "pycocotools", "opencv-python", "polars", "albumentations"]
serve = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart", "pillow", "requests"]
dev = ["pytest>=8", "ruff>=0.4", "httpx", "pillow"]

[project.scripts]
cardd-eda = "cardd.cli.eda:main"
cardd-convert = "cardd.cli.convert:main"
cardd-verify = "cardd.cli.verify:main"
cardd-train = "cardd.cli.train:main"
cardd-evaluate = "cardd.cli.evaluate:main"

[project.urls]
Source = "https://github.com/JShi12/vehicleDD"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# Explicit baseline (pycodestyle errors, pyflakes, isort, pyupgrade) rather than relying on
# whatever ruff's own default rule set happens to be - keeps `ruff check` results stable across
# ruff versions instead of silently picking up new rule categories on a version bump.
select = ["E", "F", "I", "UP"]
